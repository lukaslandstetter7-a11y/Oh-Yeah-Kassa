<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Uptown Kasse</title>
  <style>
    :root{--bg:#0f1115;--panel:#171a20;--card:#20242b;--line:#343a43;--text:#f5f7fa;--muted:#aab2bd;--accent:#6fbe44;--danger:#d7463b}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;background:var(--bg);color:var(--text)}
    button,input{font:inherit}button{touch-action:manipulation}.app{padding:14px;max-width:1400px;margin:auto}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.brand{font-size:22px;font-weight:800;margin-right:auto}.search{min-height:46px;min-width:240px;flex:1;max-width:520px;border:1px solid var(--line);border-radius:12px;background:#11141a;color:var(--text);padding:0 14px;font-size:16px}.reset{min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:white;padding:0 15px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px;margin-top:14px}.cats{display:flex;gap:8px;overflow:auto;padding-bottom:8px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.cat{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:white;border-radius:11px;min-height:46px;padding:0 16px}.cat.active{background:var(--accent);color:#111;font-weight:800;border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.product{min-height:106px;border:1px solid var(--line);background:var(--card);border-radius:13px;color:white;padding:12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}.product:active{transform:scale(.985)}.pname{font-weight:750;line-height:1.15}.detail{font-size:13px;color:var(--muted);margin-top:4px}.price{font-size:19px;font-weight:800;color:var(--accent);margin-top:8px}.side{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px;align-self:start}.side h2,.side h3{margin:0 0 10px}.cart{display:flex;flex-direction:column;gap:8px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.rowname{font-weight:700}.rowsub{font-size:13px;color:var(--muted);margin-top:3px}.controls{display:flex;gap:6px;align-items:center}.qty{min-width:40px;text-align:center}.ctrl{width:42px;height:42px;border:1px solid var(--line);border-radius:10px;background:#252a31;color:white;font-size:20px}.total{display:flex;justify-content:space-between;align-items:end;padding:16px 0;border-bottom:1px solid var(--line)}.total strong{font-size:30px;color:var(--accent)}.cash{margin-top:16px}.cash input{width:100%;min-height:54px;background:#11141a;color:white;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:24px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}.quick button{min-height:44px;background:#252a31;color:white;border:1px solid var(--line);border-radius:10px}.change{margin-top:12px;padding:13px;border-radius:12px;background:#11141a}.change strong{font-size:30px;color:var(--accent)}.status{font-size:13px;color:var(--muted);margin-top:4px}.empty{color:var(--muted);text-align:center;padding:18px 0}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(min-width:1200px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  </style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">UPTOWN’S KASSE</div><input id="search" class="search" placeholder="Produkt suchen…"><button id="reset" class="reset">Neuer Bon</button></div>
  <div class="layout">
    <main><div id="cats" class="cats"></div><div id="grid" class="grid"></div></main>
    <aside class="side">
      <h2>Bon <span id="count" style="color:var(--muted);font-weight:500;font-size:14px"></span></h2>
      <div id="cart" class="cart"></div>
      <div class="total"><span>Gesamt</span><strong id="total">0,00 €</strong></div>
      <div class="cash"><h3>Barzahlung / Rückgeld</h3><input id="given" inputmode="decimal" placeholder="Gegeben, z. B. 20,00"><div class="quick"><button data-cash="10">10 €</button><button data-cash="20">20 €</button><button data-cash="50">50 €</button><button id="exact">Genau</button></div><div class="change"><div>Rückgeld</div><strong id="change">0,00 €</strong><div id="status" class="status">Barbetrag eingeben.</div></div></div>
    </aside>
  </div>
</div>
<script>
const products=[
{id:1,c:'Bier',n:'Starobrno',d:'0,5 l · offen',p:5.80},{id:2,c:'Bier',n:'Wieselburger Stammbräu',d:'0,50 l · Flasche',p:6.00},{id:3,c:'Bier',n:'Gösser Naturgold alkoholfrei',d:'0,50 l · Flasche',p:5.80},
{id:4,c:'Wein',n:'Liter/Liter (Hausmenü)',d:'1 l Wein + 1 l Soda',p:36.00},{id:5,c:'Wein',n:'Spritzer weiß/rot',d:'0,25 l',p:4.50},{id:6,c:'Wein',n:'Wild Berry Spritz Stibitzer',d:'0,33 l',p:5.50},{id:7,c:'Wein',n:'Kaiserspritzer',d:'0,25 l',p:5.00},{id:8,c:'Wein',n:'Aperol Spritz',d:'0,25 l',p:7.50},{id:9,c:'Wein',n:'Sarti Spritz',d:'0,25 l',p:7.50},{id:10,c:'Wein',n:'Grüner Veltliner Hundschupfen, Hagn',d:'0,75 l',p:33.00},{id:11,c:'Wein',n:'Gelber Muskateller, Hagn',d:'0,75 l',p:33.00},{id:12,c:'Wein',n:'Achterl',d:'1/8 l',p:5.50},{id:13,c:'Wein',n:'Rotwein Zweigelt Stifterl, Hagn',d:'0,25 l',p:6.80},{id:14,c:'Wein',n:'Big John Cuvée Reserve, Scheiblhofer',d:'0,75 l',p:39.00},
{id:15,c:'Sprudel',n:'Prosecco Casa Gheller Cuvée Brut Rose',d:'0,75 l',p:45.00},{id:16,c:'Sprudel',n:'Prosecco Casa Gheller Treviso Brut DOC',d:'0,75 l',p:45.00},{id:17,c:'Sprudel',n:'Schlumberger Sparkling',d:'0,75 l',p:45.00},{id:18,c:'Sprudel',n:'Moet & Chandon Brut Imperial',d:'0,75 l',p:129.00},
{id:19,c:'Alkoholfrei',n:'Coca Cola / zero',d:'0,33 l',p:4.50},{id:20,c:'Alkoholfrei',n:'Frucade',d:'0,33 l',p:4.50},{id:21,c:'Alkoholfrei',n:'Almdudler',d:'0,33 l',p:4.50},{id:22,c:'Alkoholfrei',n:'Makava BIO Eistee',d:'0,33 l',p:4.50},{id:23,c:'Alkoholfrei',n:'Red Bull',d:'0,25 l',p:4.50},{id:24,c:'Alkoholfrei',n:'Tonic Water Schweppes',d:'0,20 l',p:4.50},{id:25,c:'Alkoholfrei',n:'Orangensaft',d:'0,25 l',p:3.20},{id:26,c:'Alkoholfrei',n:'Orangensaft gespritzt',d:'0,25 l',p:2.50},{id:27,c:'Alkoholfrei',n:'Orangensaft gespritzt',d:'0,50 l',p:5.00},{id:28,c:'Alkoholfrei',n:'Römerquelle still',d:'0,33 l',p:3.50},{id:29,c:'Alkoholfrei',n:'Soda',d:'0,25 l',p:1.80},{id:30,c:'Alkoholfrei',n:'Soda',d:'1,00 l',p:7.20},{id:31,c:'Alkoholfrei',n:'Soda Zitrone oder Holunder',d:'0,50 l',p:4.10},
{id:32,c:'Longdrinks',n:'Cola Rum',d:'',p:5.50},{id:33,c:'Longdrinks',n:'Barcardi Cola',d:'',p:5.50},{id:34,c:'Longdrinks',n:'Vodka Orange',d:'',p:5.50},{id:35,c:'Longdrinks',n:'Vodka Wellness',d:'',p:5.50},{id:36,c:'Longdrinks',n:'Vodka Makava',d:'',p:9.00},{id:37,c:'Longdrinks',n:'Vodka Red Bull',d:'',p:9.00},{id:38,c:'Longdrinks',n:'Gin Tonic',d:'',p:9.00},{id:39,c:'Longdrinks',n:'Gin Makava',d:'',p:9.00},
{id:40,c:'Shots',n:'Jägermeister',d:'2 cl',p:4.50},{id:41,c:'Shots',n:'Klopfer',d:'2 cl',p:4.50},{id:42,c:'Shots',n:'Berliner Luft',d:'2 cl',p:4.50},{id:43,c:'Shots',n:'Espresso Martini',d:'2 cl',p:4.50},
{id:44,c:'Pfand',n:'Pfandbecher',d:'',p:2.00},{id:45,c:'Pfand',n:'Pfand-Weinglas',d:'',p:2.00}
];
const cats=['Bier','Wein','Sprudel','Alkoholfrei','Longdrinks','Shots','Pfand'];let cat='Bier';const q=new Map();const €=v=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(v);const el=id=>document.getElementById(id);
function total(){return products.reduce((s,p)=>s+p.p*(q.get(p.id)||0),0)}
function renderCats(){el('cats').innerHTML='';cats.forEach(c=>{const b=document.createElement('button');b.className='cat'+(c===cat?' active':'');b.textContent=c;b.onclick=()=>{cat=c;renderCats();renderProducts()};el('cats').append(b)})}
function renderProducts(){const term=el('search').value.toLowerCase().trim();el('grid').innerHTML='';products.filter(p=>p.c===cat&&(!term||(p.n+' '+p.d).toLowerCase().includes(term))).forEach(p=>{const b=document.createElement('button');b.className='product';b.innerHTML='<div><div class="pname">'+p.n+'</div><div class="detail">'+(p.d||p.c)+'</div></div><div class="price">'+€(p.p)+'</div>';b.onclick=()=>{q.set(p.id,(q.get(p.id)||0)+1);renderCart()};el('grid').append(b)})}
function renderCart(){const c=el('cart');c.innerHTML='';let count=0;products.filter(p=>(q.get(p.id)||0)>0).forEach(p=>{const n=q.get(p.id);count+=n;const r=document.createElement('div');r.className='row';const info=document.createElement('div');info.innerHTML='<div class="rowname">'+p.n+'</div><div class="rowsub">'+n+' × '+€(p.p)+' = '+€(n*p.p)+'</div>';const ctr=document.createElement('div');ctr.className='controls';const minus=document.createElement('button');minus.className='ctrl';minus.textContent='−';minus.onclick=()=>{n<=1?q.delete(p.id):q.set(p.id,n-1);renderCart()};const qty=document.createElement('div');qty.className='qty';qty.textContent=n;const plus=document.createElement('button');plus.className='ctrl';plus.textContent='+';plus.onclick=()=>{q.set(p.id,n+1);renderCart()};ctr.append(minus,qty,plus);r.append(info,ctr);c.append(r)});if(!count)c.innerHTML='<div class="empty">Noch keine Produkte gewählt.</div>';el('count').textContent=count?'('+count+' Artikel)':'';el('total').textContent=€(total());updateChange()}
function parseCash(v){const n=Number(String(v).replace(',','.').trim());return Number.isFinite(n)&&n>=0?n:null}function updateChange(){const g=parseCash(el('given').value),t=total();if(g===null){el('change').textContent=€(0);el('status').textContent='Barbetrag eingeben.';return}const d=Math.round((g-t)*100)/100;if(d<0){el('change').textContent=€(0);el('status').textContent='Es fehlen '+€(-d)+'.'}else{el('change').textContent=€(d);el('status').textContent=d===0?'Passend bezahlt.':'Rückgeld auszahlen.'}}
el('search').addEventListener('input',renderProducts);el('given').addEventListener('input',updateChange);document.querySelectorAll('[data-cash]').forEach(b=>b.onclick=()=>{el('given').value=Number(b.dataset.cash).toFixed(2).replace('.',',');updateChange()});el('exact').onclick=()=>{el('given').value=total().toFixed(2).replace('.',',');updateChange()};el('reset').onclick=()=>{q.clear();el('given').value='';renderCart()};renderCats();renderProducts();renderCart();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body></html>
